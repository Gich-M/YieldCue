<div class="page-head">
  <div>
    <h1>{{heading}}</h1>
    <p class="lede">{{lede}}</p>
  </div>
  <a class="btn" href="/workflows/{{workflow_id}}">Back</a>
</div>
<div class="card">
  {{type_picker}}
  <form method="post" action="{{action}}">
    {{fields}}
    <div class="actions">
      <button class="btn primary" type="submit">{{submit_label}}</button>
      <a class="btn" href="/workflows/{{workflow_id}}">Cancel</a>
    </div>
  </form>
</div>
